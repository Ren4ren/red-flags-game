<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Flag Dating — 概念分鏡 v0.1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    color: #e8e0d4;
    font-family: 'Helvetica Neue', 'Hiragino Sans', 'Noto Sans TC', Arial, sans-serif;
    padding: 48px 32px 64px;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-bottom: 48px;
    border-bottom: 1px solid #2a2a2a;
    padding-bottom: 20px;
  }

  header h1 {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #c0392b;
  }

  header span {
    font-size: 12px;
    color: #555;
    letter-spacing: 0.05em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .frame {
    position: relative;
    background: #111;
    aspect-ratio: 16/9;
    overflow: hidden;
    cursor: default;
  }

  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(15%);
    transition: filter 0.3s ease;
  }

  .frame:hover img {
    filter: grayscale(0%);
  }

  .frame-placeholder {
    width: 100%;
    height: 100%;
    background: #161616;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed #2a2a2a;
  }

  .frame-placeholder span {
    font-size: 11px;
    color: #333;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .frame-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
    pointer-events: none;
  }

  .frame-meta {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 14px 14px;
  }

  .frame-number {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #c0392b;
    font-weight: 400;
    margin-bottom: 3px;
    text-transform: uppercase;
  }

  .frame-title {
    font-size: 12px;
    font-weight: 500;
    color: #e8e0d4;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .frame-dialogue {
    font-size: 11px;
    color: #999;
    font-style: italic;
    line-height: 1.5;
    letter-spacing: 0.02em;
  }

  .frame-dialogue.no-dialogue {
    color: #444;
  }

  .frame-label {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #2a2a2a;
    padding: 3px 8px;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: #666;
    text-transform: uppercase;
  }

  footer {
    max-width: 1200px;
    margin: 32px auto 0;
    padding-top: 20px;
    border-top: 1px solid #1a1a1a;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  footer p {
    font-size: 11px;
    color: #333;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<header>
  <h1>Red Flag Dating</h1>
  <span>概念分鏡 · Concept Storyboard · v0.1</span>
  <span style="margin-left:auto">2026-06-24</span>
</header>

<div class="grid">

  <div class="frame">
    <img src="concepts/01-fate.png" alt="01 FATE">
    <div class="frame-overlay"></div>
    <div class="frame-label">01</div>
    <div class="frame-meta">
      <div class="frame-number">FATE</div>
      <div class="frame-title">緣分</div>
      <div class="frame-dialogue">「一開始以為是緣分」</div>
    </div>
  </div>

  <div class="frame">
    <img src="concepts/02-pattern.png" alt="02 PATTERN">
    <div class="frame-overlay"></div>
    <div class="frame-label">02</div>
    <div class="frame-meta">
      <div class="frame-number">PATTERN</div>
      <div class="frame-title">模式</div>
      <div class="frame-dialogue">「後來發現是模式」</div>
    </div>
  </div>

  <div class="frame">
    <img src="concepts/03-bound.png" alt="03 BOUND">
    <div class="frame-overlay"></div>
    <div class="frame-label">03</div>
    <div class="frame-meta">
      <div class="frame-number">BOUND</div>
      <div class="frame-title">束縛</div>
      <div class="frame-dialogue">「看見那可能是束縛」</div>
    </div>
  </div>

  <div class="frame">
    <img src="concepts/04-choice.png" alt="04 CHOICE">
    <div class="frame-overlay"></div>
    <div class="frame-label">04</div>
    <div class="frame-meta">
      <div class="frame-number">CHOICE</div>
      <div class="frame-title">選擇的餘裕</div>
      <div class="frame-dialogue">「還有沒有選擇的餘裕？」</div>
    </div>
  </div>

  <div class="frame">
    <div class="frame-placeholder">
      <span>05 · 待補圖</span>
    </div>
    <div class="frame-label">05</div>
    <div class="frame-meta">
      <div class="frame-number">FACE</div>
      <div class="frame-title">知道了，但還沒說出口</div>
      <div class="frame-dialogue no-dialogue">（無對白）</div>
    </div>
  </div>

  <div class="frame">
    <img src="concepts/06-title.png" alt="06 TITLE">
    <div class="frame-overlay"></div>
    <div class="frame-label">06</div>
    <div class="frame-meta">
      <div class="frame-number">TITLE</div>
      <div class="frame-title">Red Flag Dating</div>
      <div class="frame-dialogue no-dialogue">—</div>
    </div>
  </div>

</div>

<footer>
  <p>Red Flag Dating · 概念開發階段，非正式發布物</p>
  <p>© Ren 2026</p>
</footer>

</body>
</html>
